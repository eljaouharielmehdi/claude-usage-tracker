services:
  claude-usage-tracker:
    build: ./app
    container_name: claude-usage-tracker
    restart: unless-stopped
    ports:
      - "61209:8687"
    volumes:
      # Read-only: the app only ever reads these session logs, never writes to them.
      # One entry per device, mounted under /data/devices/<name> — that name
      # is what shows up in the "By device" panel. This machine's own logs:
      - ${HOME}/.claude/projects:/data/devices/srv:ro
      # Remote devices, synced in by sync/pull_devices.py (cron) into
      # remote_projects/<name>/ — add one line here per device in sync/devices.json.
      - ./remote_projects/laptop:/data/devices/laptop:ro
      - ./config:/config
      # Written by the host-level anthropic-netmon systemd service (see netmon/).
      - ./netmon/data:/data/network:ro
      # Written by quota/statusline.py via the global statusLine hook (see quota/README.md).
      - ${HOME}/.claude/usage_state:/data/quota:ro
    environment:
      - REFRESH_SECONDS=2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8687/api/stats', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
